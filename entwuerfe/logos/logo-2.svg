<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15144a" />
      <stop offset="100%" stop-color="#0d0c2b" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#6366f1" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" rx="180" fill="url(#bgGrad2)"/>

  <!-- Geometric Symbol (The Integration Nexus) -->
  <g filter="url(#glow2)" transform="translate(500, 360)">
    <!-- Central Hexagonal Nodes & Interconnected Paths -->
    <!-- Left Wing (J-Path) -->
    <path d="M -120 -150 L -60 -185 L -60 -40 C -60 40 -90 90 -160 90 C -200 90 -230 70 -250 40 L -205 0 C -195 15 -180 25 -160 25 C -135 25 -120 10 -120 -25 Z" fill="#ffffff"/>

    <!-- Center Bridge (T-Bar) -->
    <path d="M -150 -150 L 150 -150 L 150 -90 L 30 -90 L 30 140 L -30 140 L -30 -90 L -150 -90 Z" fill="#ffffff"/>

    <!-- Right Node & Branch (K-Interface) -->
    <path d="M 60 -150 L 120 -150 L 120 140 L 60 140 Z" fill="#ffffff"/>
    <path d="M 120 10 L 210 -150 L 285 -150 L 175 15 L 295 140 L 215 140 L 120 40 Z" fill="url(#neonGrad)"/>

    <!-- Data Flow Interface Points -->
    <circle cx="-160" cy="55" r="10" fill="#38bdf8"/>
    <circle cx="0" cy="-120" r="12" fill="#6366f1"/>
    <circle cx="250" cy="-150" r="10" fill="#38bdf8"/>
    <circle cx="255" cy="140" r="10" fill="#a855f7"/>
  </g>

  <!-- Typography -->
  <g text-anchor="middle">
    <text x="500" y="690" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="112" font-weight="900" letter-spacing="14" fill="#ffffff">JTK</text>
    <line x1="320" y1="735" x2="680" y2="735" stroke="url(#lineGrad)" stroke-width="4"/>
    <text x="500" y="795" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700" letter-spacing="16" fill="#8d8cc0">CONSULTING</text>
    <text x="500" y="845" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" letter-spacing="8" fill="#5d5b99">IT-BERATUNG &amp; SOFTWARE</text>
  </g>
</svg>