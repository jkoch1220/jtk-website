<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1e63" />
      <stop offset="100%" stop-color="#12113a" />
    </linearGradient>
    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" rx="180" fill="url(#bgGrad1)"/>
  
  <!-- Outer subtle tech frame -->
  <rect x="60" y="60" width="880" height="880" rx="140" fill="none" stroke="#2b2a7e" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Logo Mark (Integrated Monogram J-T-K) -->
  <g filter="url(#subtleGlow)" transform="translate(180, 220)">
    <!-- Letter J (Left loop) -->
    <path d="M 120 40 L 120 220 C 120 290 80 330 10 330 C -20 330 -50 315 -70 295 L -35 245 C -20 260 0 270 15 270 C 45 270 60 250 60 215 L 60 40 Z" fill="#ffffff" transform="translate(70, 0)"/>

    <!-- Letter T (Center Bar & Stem) -->
    <path d="M 230 40 L 450 40 L 450 100 L 370 100 L 370 330 L 310 330 L 310 100 L 230 100 Z" fill="#ffffff"/>
    
    <!-- Accent Connector Dot (Interface/System Link) -->
    <circle cx="340" cy="40" r="14" fill="url(#accentGrad1)"/>

    <!-- Letter K (Right Stem & Dynamic Diagonal Arms) -->
    <path d="M 490 40 L 550 40 L 550 330 L 490 330 Z" fill="#ffffff"/>
    <path d="M 545 190 L 640 40 L 720 40 L 600 205 L 725 330 L 645 330 L 545 220 Z" fill="url(#accentGrad1)"/>
  </g>

  <!-- Brand Typography -->
  <g text-anchor="middle">
    <!-- "JTK" Large Wordmark -->
    <text x="500" y="680" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="108" font-weight="900" letter-spacing="12" fill="#ffffff">JTK</text>
    
    <!-- Thin divider -->
    <line x1="360" y1="730" x2="640" y2="730" stroke="url(#accentGrad1)" stroke-width="3" stroke-linecap="round"/>

    <!-- "CONSULTING" Subtext -->
    <text x="500" y="785" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="600" letter-spacing="18" fill="#b9b8e0">CONSULTING</text>
  </g>
</svg>