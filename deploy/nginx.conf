# Nur nötig, wenn auf dem VPS schon Nginx läuft (sonst deploy/Caddyfile nehmen).
# Nach dem Einbinden HTTPS holen mit:
#   certbot --nginx -d jtkconsulting.de -d www.jtkconsulting.de

server {
    listen 80;
    listen [::]:80;
    server_name jtkconsulting.de www.jtkconsulting.de;

    root /var/www/jtkconsulting;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 404 /404.html;
}
