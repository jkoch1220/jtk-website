# Nur nötig, wenn auf dem VPS schon Nginx läuft (sonst deploy/Caddyfile nehmen).
# Nach dem Einbinden HTTPS holen mit:
#   certbot --nginx -d jtkconsulting.de -d www.jtkconsulting.de
#
# Wie bei Caddy kein Zugriffsprotokoll (siehe Datenschutzerklärung „Server-Protokolle“). Das
# Fehlerprotokoll enthält IP-Adressen; dafür in /etc/logrotate.d/nginx „rotate 7“ statt 14 setzen.

server {
    listen 80;
    listen [::]:80;
    server_name jtkconsulting.de www.jtkconsulting.de;

    root /var/www/jtkconsulting;
    index index.html;
    access_log off;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Kontaktformular, Tracking und Gesundheitscheck gehen an den Website-Dienst (Docker, nur lokal
    # erreichbar). Nur diese drei Pfade: Die Portal-API (/api/portal/*) gibt es nur über app.koch.consulting.
    location ~ ^/api/(anfrage|e|gesundheit)$ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64k;
    }

    # Alle anderen /api-Pfade gibt es auf der Website nicht (Regex-Locations oben gehen vor)
    location /api/ {
        return 404;
    }

    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 404 /404.html;
}
